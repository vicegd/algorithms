name: Publish Javadoc to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Generate and deploy Javadoc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Generate Javadoc
        run: |
          set -euo pipefail
          mvn --no-transfer-progress -e compile javadoc:jar
          test -d target/apidocs || (echo "ERROR: target/apidocs not created" && exit 1)

      - name: Prepare deploy directory
        run: |
          mkdir -p _deploy/javadoc
          cp -r docs/. _deploy/
          cp -r target/apidocs/. _deploy/javadoc/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _deploy
