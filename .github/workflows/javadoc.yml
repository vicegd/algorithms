name: Publish Javadoc to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Generate and deploy Javadoc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Generate Javadoc
        run: mvn --no-transfer-progress compile javadoc:javadoc

      - name: Prepare deploy directory
        run: |
          mkdir -p _deploy/javadoc
          cp -r docs/. _deploy/
          APIDOCS=$(find target -type d -name "apidocs" 2>/dev/null | head -1)
          if [ -z "$APIDOCS" ]; then
            echo "::error::Javadoc directory not found under target/. Contents of target/:"
            find target -maxdepth 3 -type d
            exit 1
          fi
          echo "Copying Javadoc from: $APIDOCS"
          cp -r "$APIDOCS/." _deploy/javadoc/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _deploy
